fn:
  label: FiniteNetherite
fnf:
  label: Fixtures & Footnotes
workshop:
  label: Workshop

# Post types
release:
  label: Release
support:
  label: Support
shout-out:
  label: Shout-out
writing:
  label: Writing
announcement:
  label: Announcement
